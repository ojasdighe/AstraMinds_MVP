steps:
  # ── Step 1: Build the container image using the multi-stage Dockerfile
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/astraminds:$BUILD_ID'
      - '-t'
      - 'gcr.io/$PROJECT_ID/astraminds:latest'
      - '.'

  # ── Step 2: Push container image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/astraminds:$BUILD_ID'

  # ── Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'astraminds'
      - '--image'
      - 'gcr.io/$PROJECT_ID/astraminds:$BUILD_ID'
      - '--region'
      - '$_REGION'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--update-env-vars'
      - 'NODE_ENV=production,FIRESTORE_ENABLED=true,GOOGLE_CLIENT_ID=$_GOOGLE_CLIENT_ID'

images:
  - 'gcr.io/$PROJECT_ID/astraminds:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/astraminds:latest'

substitutions:
  _REGION: 'asia-south2' # Deployed to India Delhi (asia-south2)
  _GOOGLE_CLIENT_ID: '959185646078-7s4m1qp4159bief441dkiom9ksci6jb3.apps.googleusercontent.com'

options:
  logging: CLOUD_LOGGING_ONLY
